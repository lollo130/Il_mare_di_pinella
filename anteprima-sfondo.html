<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anteprima sfondo — Il Mare di Pinella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --base:#FDFBF7; --ink:#122146; --cobalt:#1B4096;
      --line:#C3AF88;            /* tratto inciso, beige/dorato */
      --line-soft:#D8CBAE;
      --font-display:"Cormorant Garamond",Georgia,serif;
      --font-body:"Space Grotesk",system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; font-family:var(--font-body); color:var(--ink);
      /* gradiente pastello: freddo in alto -> caldo in basso, come nel riferimento */
      background:
        radial-gradient(60% 45% at 85% 90%, rgba(247,217,176,0.55) 0%, transparent 60%),
        radial-gradient(55% 40% at 12% 8%, rgba(214,228,238,0.65) 0%, transparent 60%),
        linear-gradient(165deg, #E9F0F5 0%, #FDFBF7 42%, #FBEAD3 100%);
      background-attachment:fixed;
    }
    /* ----- OVERLAY ARTE A COPERTURA TOTALE (non cliccabile) ----- */
    .bg-art{
      position:fixed; inset:0; z-index:0; pointer-events:none;
      opacity:.45;
    }
    .bg-art svg{ width:100%; height:100%; display:block; }

    .page{ position:relative; z-index:1; }
    .hero{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:2rem; }
    .hero__inner{ max-width:640px; background:radial-gradient(70% 70% at 50% 50%, rgba(253,251,247,0.78) 0%, rgba(253,251,247,0) 75%); padding:2rem; border-radius:30px; }
    .eyebrow{ font-weight:600; text-transform:uppercase; letter-spacing:.26em; font-size:.72rem; color:#E2722B; margin:0 0 1rem; }
    h1{ font-family:var(--font-display); font-size:clamp(2.8rem,7vw,5rem); line-height:1.04; color:var(--cobalt); margin:0 0 1rem; }
    p{ font-size:clamp(1.05rem,1.8vw,1.2rem); line-height:1.65; opacity:.85; margin:0 auto; max-width:52ch; }
    .btn{ display:inline-block; margin-top:2rem; padding:.9rem 1.8rem; background:var(--cobalt); color:#fff; border-radius:999px; font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <!-- ===================== SFONDO ARTISTICO ===================== -->
  <div class="bg-art" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none"
         stroke="var(--line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <!-- onde a contorno: 3 forme che ripeto in verticale -->
        <path id="wA" d="M-60 0 C 260 -60 460 70 740 16 S 1240 -60 1500 26"/>
        <path id="wB" d="M-60 0 C 240 72 520 -52 760 30 S 1220 92 1500 6"/>
        <path id="wC" d="M-60 0 C 320 -42 560 62 800 4 S 1260 -52 1500 46"/>
      </defs>

      <!-- ONDE su tutta la superficie (effetto mappa/acqua) -->
      <g stroke="var(--line-soft)">
        <use href="#wA" transform="translate(0,44)"/>
        <use href="#wC" transform="translate(0,92)"/>
        <use href="#wB" transform="translate(0,140)"/>
        <use href="#wA" transform="translate(0,188)"/>
        <use href="#wC" transform="translate(0,236)"/>
        <use href="#wB" transform="translate(0,284)"/>
        <use href="#wA" transform="translate(0,332)"/>
        <use href="#wC" transform="translate(0,380)"/>
        <use href="#wB" transform="translate(0,428)"/>
        <use href="#wA" transform="translate(0,476)"/>
        <use href="#wC" transform="translate(0,524)"/>
        <use href="#wB" transform="translate(0,572)"/>
        <use href="#wA" transform="translate(0,620)"/>
        <use href="#wC" transform="translate(0,668)"/>
        <use href="#wB" transform="translate(0,716)"/>
        <use href="#wA" transform="translate(0,764)"/>
        <use href="#wC" transform="translate(0,812)"/>
        <use href="#wB" transform="translate(0,860)"/>
      </g>

      <!-- spirali / ricci eleganti -->
      <path d="M120 470c0-30 44-30 44 2 0 40-66 40-66-6 0-52 88-54 96 4" opacity=".8"/>
      <path d="M1300 250c0-28 40-28 40 2 0 36-60 36-60-6 0-48 80-50 88 4" opacity=".8"/>

      <!-- ============ AGRUMI / ULIVO (line-art) ============ -->
      <!-- limone con foglie, alto-sinistra -->
      <g transform="translate(95,80)">
        <ellipse cx="60" cy="72" rx="48" ry="35" transform="rotate(-28 60 72)"/>
        <path d="M30 100l-10 9"/><path d="M92 46l9-9"/>
        <path d="M94 46c3-24 22-37 46-35 0 24-19 39-46 35z"/>
        <path d="M100 40c11-7 24-13 34-23"/>
        <path d="M94 46c-12-17-11-35 0-48"/>
      </g>

      <!-- fetta d'agrume intera, centro-alto -->
      <g transform="translate(900,150)">
        <circle cx="60" cy="60" r="54"/>
        <circle cx="60" cy="60" r="43"/>
        <path d="M60 6v108M6 60h108M22 22l76 76M98 22l-76 76M39 12l42 96M81 12l-42 96"/>
      </g>

      <!-- mezza fetta, lato sinistro -->
      <g transform="translate(70,430)">
        <path d="M0 0h150"/>
        <path d="M0 0a75 75 0 0 0 150 0"/>
        <path d="M14 0a61 61 0 0 0 122 0"/>
        <path d="M75 0v61M26 18l49 36M124 18l-49 36M46 4l29 53M104 4l-29 53"/>
      </g>

      <!-- ramo d'ulivo, basso-destra -->
      <g transform="translate(980,560)">
        <path d="M0 0C60 50 140 120 250 230"/>
        <ellipse cx="46" cy="48" rx="26" ry="9" transform="rotate(40 46 48)"/>
        <ellipse cx="92" cy="92" rx="26" ry="9" transform="rotate(40 92 92)"/>
        <ellipse cx="140" cy="138" rx="26" ry="9" transform="rotate(40 140 138)"/>
        <ellipse cx="70" cy="28" rx="26" ry="9" transform="rotate(-16 70 28)"/>
        <ellipse cx="118" cy="74" rx="26" ry="9" transform="rotate(-16 118 74)"/>
        <circle cx="118" cy="120" r="10"/>
        <circle cx="170" cy="172" r="10"/>
      </g>

      <!-- due limoni, basso-sinistra -->
      <g transform="translate(180,690)">
        <ellipse cx="55" cy="40" rx="44" ry="32" transform="rotate(-22 55 40)"/>
        <path d="M86 18l9-8"/><path d="M27 64l-9 8"/>
        <ellipse cx="150" cy="70" rx="40" ry="29" transform="rotate(-30 150 70)"/>
        <path d="M178 50l8-8"/>
        <path d="M120 38c2-20 18-30 39-28 0 20-16 32-39 28z"/>
      </g>
    </svg>
  </div>

  <!-- ===================== CONTENUTO DEMO ===================== -->
  <div class="page">
    <section class="hero">
      <div class="hero__inner">
        <p class="eyebrow">Osteria di mare siracusana</p>
        <h1>Il Mare di Pinella</h1>
        <p>Cucina di mare e tradizione siciliana, nel cuore di Siracusa.
           Testo di prova: lo sfondo è inciso su tutta la superficie,
           ma il riquadro morbido dietro al testo mantiene la leggibilità.</p>
        <a class="btn" href="#">Prenota un tavolo</a>
      </div>
    </section>
  </div>
</body>
</html>
