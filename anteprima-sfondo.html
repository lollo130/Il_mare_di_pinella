<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anteprima sfondo — Il Mare di Pinella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ======================================================================
       SFONDO — Il Mare di Pinella
       Base: gradiente morbido · Overlay: pattern mediterraneo come filigrana
       ====================================================================== */

    /* 1) SFONDO BASE: gradiente */
    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(circle at 15% 30%, #FDFBF7 0%, #FCEFE3 60%, #eef3f7 100%);
      font-family:"Space Grotesk",system-ui,sans-serif;
      color:#122146;
    }

    /* 2) OVERLAY PATTERN come filigrana fissa, dietro ai contenuti, non cliccabile */
    body::before{
      content:"";
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background-image: url("assets/img/pattern-mediterraneo.png");
      background-size: 600px;
      background-repeat: repeat;
      background-position: top left;
      opacity: 0.08;
      pointer-events: none;   /* non blocca i click */
      z-index: -1;            /* sta dietro a tutto */
    }

    /* ---- contenuto demo (solo per mostrare leggibilità) ---- */
    .hero{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:2rem; }
    .hero__inner{ max-width:640px; }
    .eyebrow{ font-weight:600; text-transform:uppercase; letter-spacing:.26em; font-size:.72rem; color:#E2722B; margin:0 0 1rem; }
    h1{ font-family:"Cormorant Garamond",Georgia,serif; font-size:clamp(2.8rem,7vw,5rem); line-height:1.04; color:#1B4096; margin:0 0 1rem; }
    p{ font-size:clamp(1.05rem,1.8vw,1.2rem); line-height:1.65; opacity:.85; margin:0 auto; max-width:52ch; }
    .btn{ display:inline-block; margin-top:2rem; padding:.9rem 1.8rem; background:#1B4096; color:#fff; border-radius:999px; font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__inner">
      <p class="eyebrow">Osteria di mare siracusana</p>
      <h1>Il Mare di Pinella</h1>
      <p>Cucina di mare e tradizione siciliana, nel cuore di Siracusa.
         Testo di prova: il pattern mediterraneo fa da filigrana delicata (8%),
         il centro resta perfettamente leggibile.</p>
      <a class="btn" href="#">Prenota un tavolo</a>
    </div>
  </section>
</body>
</html>
